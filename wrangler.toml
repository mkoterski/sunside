name = "sunside-berlin"
main = "worker/src/index.js"
# Set to today's date when you first deploy.
compatibility_date = "2026-06-27"

# Serve the SPA (public/index.html) as static assets AND run the Worker for /api/*.
# This is a single free-tier Worker doing both jobs - no separate hosting needed.
[assets]
directory = "./public/"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Only invoke the Worker script for API paths; everything else serves the static
# file directly (and those static hits are not even billed).
run_worker_first = ["/api/*", "/healthz"]

# ── VBB ReST API (official) ──────────────────────────────────────────────────
# The base of the VBB ReST interface the Worker prefers inside Berlin and
# Brandenburg. It points at the test system VBB granted on 2026-09-22; when
# they unlock the production system, changing this line is the whole migration.
# See docs/vbb-api-access.md.
[vars]
VBB_REST_BASE = "https://vbb.demo.hafas.cloud/api/fahrinfo/latest"

# Which of the two VBB sources is asked first inside Berlin/Brandenburg.
# Off while we are on the test system, which serves timetable data only: no
# prognoses, no vehicle positions. Set it to "true" on the production system,
# where realtime is the point, and compare one board against mgate afterwards.
# VBB_REST_PRIMARY = "true"

# The matching access id is a SECRET and is deliberately absent from this file:
#
#   npx wrangler secret put VBB_ACCESS_ID     # deployed Worker
#   echo 'VBB_ACCESS_ID=...' >> .dev.vars     # local `wrangler dev`, gitignored
#
# Without it the provider stays off and the Worker behaves exactly as in v0.18,
# on the mgate endpoint and Transitous.

# Recommended: turn on logs/traces so you can watch cache hit rate and any 429s
# during the demo. Free tier includes a generous observability allowance.
[observability]
enabled = true
